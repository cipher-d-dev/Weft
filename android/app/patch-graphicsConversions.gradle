// --- Workaround for react-native 0.86.0 Android build bug: ---
// graphicsConversions.h (shipped inside the react-android AAR's prefab headers)
// uses std::format(), which Android's NDK libc++ does not implement.
// This patches the extracted header in the Gradle cache before every CMake
// configure, so it survives cache clears / clean checkouts / CI.
gradle.projectsEvaluated {
    tasks.matching { it.name.startsWith("configureCMakeDebug") || it.name.startsWith("configureCMakeRelease") }.all { t ->
        t.doFirst {
            def gradleHome = gradle.gradleUserHomeDir
            fileTree(dir: gradleHome, include: "caches/**/prefab/modules/reactnative/include/react/renderer/core/graphicsConversions.h").each { f ->
                def content = f.text
                def broken = 'return std::format("{}%", dimension.value);'
                if (content.contains(broken)) {
                    def fixed = 'char __rn_fmt_buf[64]; std::snprintf(__rn_fmt_buf, sizeof(__rn_fmt_buf), "%g%%", dimension.value); return __rn_fmt_buf;'
                    f.text = content.replace(broken, fixed)
                    logger.lifecycle("Patched std::format bug in: ${f}")
                }
            }
        }
    }
}
